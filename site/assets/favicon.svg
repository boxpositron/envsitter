  <rect class="bar" x="14" y="10" width="11" height="3" rx="1.5"/>
  <rect class="key" x="7" y="15.5" width="4" height="3" rx="1.5"/>
  <rect class="bar" x="13" y="15.5" width="12" height="3" rx="1.5"/>
  <rect class="key" x="7" y="21" width="6" height="3" rx="1.5"/>
  <rect class="bar" x="15" y="21" width="7" height="3" rx="1.5"/>
</svg>
